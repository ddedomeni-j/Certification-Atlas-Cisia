global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "model-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["model-api:8000"]

  - job_name: "backend-metier-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-metier-api:8001"]

  - job_name: "retraining-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["retraining-api:8002"]