name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter les tests
        run: pytest -v

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construire les services Docker
        run: docker compose build

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Construire le nom GHCR en minuscules
        id: image
        shell: bash
        run: |
          echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier model-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/model_api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/model-api:latest
            ghcr.io/${{ steps.image.outputs.repository }}/model-api:sha-${{ github.sha }}

      - name: Publier backend métier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend_metier_api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/backend-metier-api:latest
            ghcr.io/${{ steps.image.outputs.repository }}/backend-metier-api:sha-${{ github.sha }}

      - name: Publier API de réentraînement
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/retraining_api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/retraining-api:latest
            ghcr.io/${{ steps.image.outputs.repository }}/retraining-api:sha-${{ github.sha }}

      - name: Publier frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/frontend:latest
            ghcr.io/${{ steps.image.outputs.repository }}/frontend:sha-${{ github.sha }}